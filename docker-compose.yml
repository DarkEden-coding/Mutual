services:
  app:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:8787"
    volumes:
      - mutual-data:/data
      - ./backups:/backups:ro
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8787
      DATA_DIR: /data
      BACKUP_DIR: /backups
      TRUST_PROXY: ${TRUST_PROXY:-cloudflare}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mutual-data:
